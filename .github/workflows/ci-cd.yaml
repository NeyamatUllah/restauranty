name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: runs on every push and pull request ──────────────────────────────
  ci:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, discounts, items]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/backend/${{ matrix.service }}

  # ── CD: build & push images — only on merge to main ──────────────────────
  build-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth
            context: src/backend/auth
          - service: discounts
            context: src/backend/discounts
          - service: items
            context: src/backend/items
          - service: client
            context: src/client
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/restauranty-${{ matrix.service }}:latest

  # ── CD: deploy to Kubernetes — only on merge to main ─────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Create / update K8s secrets
        run: |
          kubectl create secret generic restauranty-secrets \
            --from-literal=MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            --from-literal=SECRET="${{ secrets.SECRET }}" \
            --from-literal=ORIGIN="${{ secrets.ORIGIN }}" \
            --from-literal=CLOUD_NAME="${{ secrets.CLOUD_NAME }}" \
            --from-literal=CLOUD_API_KEY="${{ secrets.CLOUD_API_KEY }}" \
            --from-literal=CLOUD_API_SECRET="${{ secrets.CLOUD_API_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -f infrastructure/k8s/
