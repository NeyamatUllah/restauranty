apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    {{- include "restauranty.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.auth }}
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: ghcr.io/{{ .Values.image.owner }}/restauranty-auth:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            {{- include "restauranty.secretEnv" . | nindent 12 }}
