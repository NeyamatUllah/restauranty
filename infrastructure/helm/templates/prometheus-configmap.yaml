{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "restauranty.labels" . | nindent 4 }}
data:
  prometheus.yaml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}

    scrape_configs:
      - job_name: auth
        static_configs:
          - targets: ['auth:3001']

      - job_name: discounts
        static_configs:
          - targets: ['discounts:3002']

      - job_name: items
        static_configs:
          - targets: ['items:3003']
{{- end }}
